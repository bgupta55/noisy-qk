# Versions are those installed when all results in results/ were produced (23 Nov 2026, macOS arm64).
# Python 3.14 requires recent wheels; if conda-forge lacks one, install that package with pip (see the pip block).
name: nqk
channels:
  - conda-forge
dependencies:
  - python=3.14
  - numpy=2.5.3
  - scipy=1.18.0
  - scikit-learn=1.9.1
  - pandas=3.0.5
  - matplotlib=3.11.1
  - joblib=1.6.0
  - pyarrow=25.0.1
  - pytest=9.1.1
  - pip
  - pip:
      - qiskit==2.5.2
      - qiskit-aer==0.17.2
      - qiskit-ibm-runtime==0.49.0
# Hardware steps need IBMQ_KEY and IBMQ_CRN in the environment (never stored in any file).
# Everything except hw_run.py / x4_run.py runs offline from the committed raw counts.
